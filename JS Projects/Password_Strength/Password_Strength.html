<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Password Strength</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Secure Your Account</h2>
        <div class="input-group">
            <label for="password">Create Password:</label>
            <input type="password" id="password" placeholder="Type here...">
        </div>
        
        <div class="strength-meter">
            <div id="strength-bar"></div>
        </div>
        <p id="strength-text">Strength: <span>None</span></p>
        
        <ul class="requirements">
            <li id="length">At least 8 characters</li>
            <li id="special">At least 1 special character</li>
            <li id="number">At least 1 number</li>
        </ul>
    </div>
    <script src="index.js"></script>
</body>
</html>
