<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Triangle Output</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Triangle Pattern Generator</h2>
        <div class="input-group">
            <label for="height">Triangle Height:</label>
            <input type="number" id="height" value="5" min="1" max="20">
        </div>
        <button onclick="generateTriangle()">Generate Triangle</button>

        <div class="output-area">
            <pre id="triangle-display"></pre>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
