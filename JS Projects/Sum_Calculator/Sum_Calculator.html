<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sum Calculator</h1>
        
        <div class="input-group">
            <input type="text" id="num1" placeholder="Value 1">
            <input type="text" id="num2" placeholder="Value 2">
        </div>
        
        <button onclick="handleCalculate()">Calculate Sum</button>
        
        <div id="result" class="result-box"></div>
    </div>

    <script src="index.js"></script>
    <script>
        function handleCalculate() {
            const val1 = document.getElementById('num1').value;
            const val2 = document.getElementById('num2').value;
            printSum(val1, val2);
        }
    </script>
</body>
</html>
